name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Environment & Debug Keystore
        run: |
          # Ensure .env.example and .env exist for Secrets Gradle Plugin
          if [ ! -f .env.example ]; then
            echo "# Kitchen 3D Studio Environment" > .env.example
          fi
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

          # Remove any stale KSP generated directory if cached
          rm -rf app/build/generated/ksp

          # Decode debug.keystore.base64 or generate a valid debug.keystore
          if [ -f debug.keystore.base64 ]; then
            base64 -di debug.keystore.base64 > debug.keystore || rm -f debug.keystore
          fi
          if ! keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null 2>&1; then
            rm -f debug.keystore
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug \
            --no-configuration-cache \
            -Djava.awt.headless=true \
            -Dkotlin.compiler.execution.strategy=daemon \
            --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kitchen-studio-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
